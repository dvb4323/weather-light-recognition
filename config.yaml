# Configuration for Weather and Time-of-Day Multi-Task Classification

data:
  root: "data"
  train_images: "data/new_train/img"
  train_anns: "data/new_train/ann"
  val_images: "data/new_val/img"
  val_anns: "data/new_val/ann"
  test_images: "data/val/img"  # Original val set (has labels)
  test_anns: "data/val/ann"

classes:
  weather:
    - "clear"
    - "partly cloudy"
    - "overcast"
    - "rainy"
    - "snowy"
    # foggy removed - only 110 samples (0.18%), untrainable
    - "undefined"
  timeofday:
    - "daytime"
    - "dawn/dusk"
    - "night"
    - "undefined"

model:
  backbone: "resnet18"
  pretrained: true
  num_weather_classes: 6  # Removed foggy
  num_time_classes: 4     # Including undefined

train:
  batch_size: 32
  num_epochs: 20
  lr: 0.0001
  weight_decay: 0.00001
  device: "cuda"  # or "cpu"
  checkpoint_dir: "checkpoints"
  save_freq: 5
  # Class weights for down-weighting undefined (Option 2)
  weather_undefined_weight: 0.01
  time_undefined_weight: 0.01

augmentation:
  input_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
